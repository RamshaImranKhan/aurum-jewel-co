# Used when Railway root directory is the repo root (not /backend)
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --prefix backend --omit=dev"]

[phases.build]
cmds = ["echo 'Backend only — deploy frontend as a separate Railway service (root: /frontend)'"]

[start]
cmd = "npm start --prefix backend"
